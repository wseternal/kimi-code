version: "3"

vars:
  BIN: kimi
  BUILD_DIR: build
  GIT_SHA:
    sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
  LDFLAGS: >-
    -X github.com/visdomtech/kimi-code/internal/cli.Version=0.1.0
    -X github.com/visdomtech/kimi-code/internal/cli.GitSHA={{.GIT_SHA}}

tasks:
  default:
    desc: Full CI pipeline (build, lint, test)
    cmds:
      - task: go:build
      - task: go:lint
      - task: go:test

  # ── Go ──────────────────────────────────────────────────────────────

  go:build:
    desc: Build Go CLI binary
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - go build -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/{{.BIN}} ./cmd/kimi
      - cp -af {{.BUILD_DIR}}/{{.BIN}} ~/bin/gkimi

  go:test:
    desc: Run Go tests with race detector
    cmds:
      - go test -race -count=1 ./...

  go:test:cover:
    desc: Run Go tests with coverage report
    cmds:
      - go test -race -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html

  go:lint:
    desc: Lint Go code with golangci-lint
    cmds:
      - golangci-lint run ./...

  go:fmt:
    desc: Format Go code
    cmds:
      - go fmt ./...

  go:tidy:
    desc: Tidy Go module dependencies
    cmds:
      - go mod tidy

  go:run:
    desc: Run Go CLI (pass CLI_ARGS="..." for arguments)
    cmds:
      - go run -ldflags "{{.LDFLAGS}}" ./cmd/kimi {{.CLI_ARGS}}

  go:release:
    desc: Cross-compile Go CLI for all platforms
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - GOOS=darwin  GOARCH=arm64 go build -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/{{.BIN}}-darwin-arm64   ./cmd/kimi
      - GOOS=darwin  GOARCH=amd64 go build -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/{{.BIN}}-darwin-amd64   ./cmd/kimi
      - GOOS=linux   GOARCH=amd64 go build -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/{{.BIN}}-linux-amd64    ./cmd/kimi
      - GOOS=linux   GOARCH=arm64 go build -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/{{.BIN}}-linux-arm64    ./cmd/kimi
      - GOOS=windows GOARCH=amd64 go build -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/{{.BIN}}-windows-amd64.exe ./cmd/kimi

  go:clean:
    desc: Clean Go build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}} coverage.out coverage.html
